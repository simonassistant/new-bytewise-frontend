name: 🚀 Deploy to Railway

on:
  push:
    branches: 
      - main
      - production
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '*.md'
  pull_request:
    branches: [main]
    types: [closed]
  workflow_dispatch:  # Allow manual deployment

env:
  NODE_VERSION: '20.19.0'

jobs:
  # Build and Test Job
  build-test:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        
      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: 🔧 Install dependencies
        run: npm ci
        
      - name: 🏗️ Build project
        run: npm run build
        env:
          NODE_ENV: production
          VITE_APP_DOMAIN: https://avatartutor.hkbu.tech
          VITE_API_BASE_URL: https://new-bytewise-backend-production-8c33.up.railway.app/api
          VITE_APP_TITLE: ByteWise Avatar Tutor
          
      - name: ✅ Build artifacts check
        run: |
          ls -la dist/
          echo "Build completed successfully!"

  # Production Deployment Job
  deploy-production:
    runs-on: ubuntu-latest
    needs: [build-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production  # GitHub environment protection
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        
      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: 🚄 Install Railway CLI
        run: |
          npm install -g @railway/cli
          railway --version
          
      - name: 🔐 Railway Authentication
        run: railway login --browserless
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          
      - name: 🎯 Link Railway Project
        run: |
          railway link --project ${{ secrets.RAILWAY_PROJECT_ID }}
          railway status
          
      - name: ⚙️ Set Environment Variables
        run: |
          railway variables --set "NODE_ENV=production" \
                          --set "VITE_APP_DOMAIN=https://avatartutor.hkbu.tech" \
                          --set "VITE_API_BASE_URL=https://new-bytewise-backend-production-8c33.up.railway.app/api" \
                          --set "VITE_APP_TITLE=ByteWise Avatar Tutor" \
                          --skip-deploys
                          
      - name: 🚀 Deploy to Railway
        run: |
          echo "🚀 Starting Railway deployment..."
          railway up --detach
          echo "✅ Deployment initiated successfully!"
          
      - name: 📊 Deployment Status
        run: |
          echo "📋 Checking deployment status..."
          railway status
          echo "🌐 Domain information:"
          railway domain || echo "No custom domains configured"
          
      - name: 📝 Post-deployment verification
        run: |
          echo "✅ Deployment completed!"
          echo "🌍 Site should be available at: https://avatartutor.hkbu.tech"
          echo "📊 Monitor with: railway logs -b"

  # Staging Deployment Job (optional)
  deploy-staging:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[staging]'))
    environment: staging
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        
      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: 🚄 Install Railway CLI
        run: npm install -g @railway/cli
        
      - name: 🔐 Railway Authentication
        run: railway login --browserless
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          
      - name: 🎯 Link Railway Staging Project
        run: |
          railway link --project ${{ secrets.RAILWAY_STAGING_PROJECT_ID }}
          railway status
          
      - name: ⚙️ Set Staging Environment Variables
        run: |
          railway variables --set "NODE_ENV=staging" \
                          --set "VITE_APP_DOMAIN=https://avatar-test.hkbu.tech" \
                          --set "VITE_API_BASE_URL=https://new-bytewise-backend-production-8c33.up.railway.app/api" \
                          --set "VITE_APP_TITLE=ByteWise Avatar Tutor (Test)" \
                          --skip-deploys
                          
      - name: 🧪 Deploy to Railway Staging
        run: railway up --detach

  # Notification Job
  notify:
    runs-on: ubuntu-latest
    needs: [deploy-production]
    if: always()
    
    steps:
      - name: 📢 Deployment Success Notification
        if: needs.deploy-production.result == 'success'
        run: |
          echo "🎉 Deployment to production successful!"
          echo "✅ Site is live at: https://avatartutor.hkbu.tech"
          
      - name: ❌ Deployment Failure Notification  
        if: needs.deploy-production.result == 'failure'
        run: |
          echo "❌ Production deployment failed!"
          echo "🔍 Check the logs above for error details"
          exit 1
